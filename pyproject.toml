[project]
name = "ragnarok"
version = "0.0.1"
description = "Ragnarok - local persistent-memory agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "sqlcipher3",
  "turbovec",
  "httpx",
  "pydantic>=2",
  "argon2-cffi>=25.1.0",
  "cryptography>=50.0.2",
  "pywin32>=312",
  "pypdf>=6.21.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
docstring-code-format = false
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["E501"]  # data tables and report lines
"ragnarok/skills/office.py" = ["E501"]  # XML namespace and content-type strings
"ragnarok/ui.py" = ["RUF001"]  # the interface deliberately uses typographic glyphs
"tests/test_m4_ui.py" = ["RUF001"]  # ...and so does its test
"tests/*" = ["RUF059"]  # unused names from tuple-returning test setup helpers
