[project]
name = "ragnarok"
version = "0.0.1"
description = "Ragnarok - local persistent-memory agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "sqlcipher3",
  "turbovec",
  "httpx",
  "pydantic>=2",
  "argon2-cffi>=25.1.0",
  "cryptography>=50.0.2",
  "pywin32>=312",
  "pypdf>=6.21.2",
  "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
docstring-code-format = false
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["E501"]  # data tables and report lines
"ragnarok/skills/office.py" = ["E501"]  # XML namespace and content-type strings
"scripts/*" = ["E501", "E702"]  # small developer helpers
"ragnarok/gui/*" = ["E501", "RUF005", "RUF007"]  # divider comments and sprite tables
"ragnarok/skills/webpage.py" = ["E501"]  # the embedded HTML page
"ragnarok/triggers/toast.py" = ["E501"]  # the embedded PowerShell script
"ragnarok/voice.py" = ["E501"]  # the embedded PowerShell scripts
"ragnarok/ui.py" = ["RUF001"]  # the interface deliberately uses typographic glyphs
"tests/test_m4_ui.py" = ["RUF001"]  # ...and so does its test
"tests/test_chat_flow.py" = ["RUF001"]  # the footer's multiplication sign
"tests/test_pdfwriter.py" = ["RUF001"]  # typographic characters are the point of one test
"tests/test_planning.py" = ["E501", "RUF015"]  # compact scripted plans
"tests/*" = ["RUF059"]  # unused names from tuple-returning test setup helpers
